name: system_panel
description: "宿主 SYSTEM — 网文系统流自我提升 App（Flutter 客户端）"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  flutter_live2d: ^1.0.2
  flutter_svg: ^2.3.0
  shared_preferences: ^2.5.6
  webview_flutter: ^4.14.1
  # ── Agent 层三件套（docs/18 §3.3，t4 集中一次加齐）──
  # http：LLM OpenAI 兼容调用（纯 Dart，无平台代码）
  http: ^1.2.0
  # image_picker：证据拍照/选图（Android 走 MediaStore，无需 manifest 权限）
  image_picker: ^1.1.0
  # path_provider：证据照片落 App 文档目录 evidence/
  path_provider: ^2.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  shared_preferences_platform_interface: ^2.4.2

flutter:
  uses-material-design: true

  # 天幕背景（宿主用 ComfyUI 生成的 Qwen-Image 底图，垫在 #bg .sky 最底层）
  assets:
    - assets/img/bg-void.jpg
    # 她的模型（标准 Live2D，本机转换）—— 见 assets/live2d/README
    #
    # ⚠️ 这个目录里除了 README 之外都不入库（版权红线，见 assets/live2d/.gitignore）。
    #    新克隆要跑一次：`python tools/l2d/convert.py`。
    #    目录本身留了 README 占位，所以即使没转，`flutter build` 也不会因为
    #    "asset directory not found" 失败 —— 只会让舞台退回全息剪影。
    #
    # ⚠️ **Flutter 声明目录时不递归子目录** —— 只写 `assets/live2d/sakiko/`
    #    的话，`motions/`、`expressions/`、`textures/` 里的文件**不会进包**，
    #    模型加载时找不到贴图/动作。子目录必须逐个列出来。
    - assets/live2d/sakiko/
    - assets/live2d/sakiko/motions/
    - assets/live2d/sakiko/expressions/
    - assets/live2d/sakiko/textures/
    # ⚠️ 对照组：标准模型 Hiyori（用来区分"我转换的模型有问题"还是
    #    "插件/模拟器不渲染"）。这个也是版权素材，同样在 .gitignore 之下。
    - assets/live2d/hiyori/
    - assets/live2d/hiyori/motions/
    - assets/live2d/hiyori/Hiyori.2048/
    # ── 路线 ②（WebView 跑原型自己的播放器）要的三份 ──
    # 舞台页：**我自己的代码，入库**
    - assets/stage/
    # 原型那个播放器 + Cubism Core（版权，不入库）
    - assets/live2d/vendor/
    # 原始 prefab 数据（那个播放器只认这个格式；版权，不入库）
    - assets/live2d/sakiko_orig/models/
    - assets/live2d/sakiko_orig/assets/

  # 字体四件套 —— 真源：prototype/opus-v2-dir/css/app.css 的 @font-face
  # 四个都是可变字体，字重/字宽必须在代码里用 fontVariations 指定：
  #   TextStyle(fontVariations: [FontVariation('wght', 700), FontVariation('wdth', 75)])
  # 光写 fontWeight 不生效（FangYuan 的默认实例是 wght 700）。
  # 原型的字体是 woff2，Flutter 不认，已用 .verify/woff2ttf.py 转成 ttf。
  fonts:
    - family: FangYuan # 正文 / 她的话（阿里妈妈方圆体，wght 200-700）
      fonts:
        - asset: assets/fonts/FangYuan-VF.ttf
    - family: ShuHei # 标题（阿里妈妈数黑体）
      fonts:
        - asset: assets/fonts/ShuHei-Bold.ttf
    - family: Tektur # 数字 / 拉丁大字（wdth 75-100，wght 400-900）
      fonts:
        - asset: assets/fonts/Tektur-VF.ttf
    - family: KodeMono # 系统读数 / 等宽（wght 400-700）
      fonts:
        - asset: assets/fonts/KodeMono-VF.ttf
