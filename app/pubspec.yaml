name: system_panel
description: "宿主 SYSTEM — 网文系统流自我提升 App（Flutter 客户端）"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  flutter_svg: ^2.3.0
  shared_preferences: ^2.5.6
  # ── Agent 层三件套（docs/18 §3.3，t4 集中一次加齐）──
  # http：LLM OpenAI 兼容调用（纯 Dart，无平台代码）
  http: ^1.2.0
  # image_picker：证据拍照/选图（Android 走 MediaStore，无需 manifest 权限）
  image_picker: ^1.1.0
  # path_provider：证据照片落 App 文档目录 evidence/
  path_provider: ^2.1.0
  audioplayers: ^6.8.1
  vibration: ^3.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  shared_preferences_platform_interface: ^2.4.2

flutter:
  uses-material-design: true

  # 天幕背景（宿主用 ComfyUI 生成的 Qwen-Image 底图，垫在 #bg .sky 最底层）
  assets:
    - assets/img/bg-void.jpg
    # 音效素材包（docs/22 R3）—— 由 tools/audio/gen_sfx.mjs 离线烘焙，
    # 参数照 prototype/opus-v2-dir/js/audio.js，可 `--seed` 重烤。
    # 「事件 → 文件」的查表在 lib/state/sfx.dart；改名要两边一起改。
    - assets/audio/
  # 字体四件套 —— 真源：prototype/opus-v2-dir/css/app.css 的 @font-face
  # 四个都是可变字体，字重/字宽必须在代码里用 fontVariations 指定：
  #   TextStyle(fontVariations: [FontVariation('wght', 700), FontVariation('wdth', 75)])
  # 光写 fontWeight 不生效（FangYuan 的默认实例是 wght 700）。
  # 原型的字体是 woff2，Flutter 不认，已用 .verify/woff2ttf.py 转成 ttf。
  # 字体：唯一基准 = 宿主养成系统_重设计.html 的 :root（L16-18）
  #   --fd Chakra Petch（标题/拉丁大字，静态 500/700 + 真斜体）
  #   --fc Noto Sans SC（中文正文，可变）
  #   --fm JetBrains Mono（等宽读数，可变）
  # 参考稿 .grade/.rank/.lu-t/.tk-g b/.rec-r 都是 italic，
  # 所以 Chakra Petch 必须带 BoldItalic 静态档，否则斜体是合成的。
  fonts:
    - family: ChakraPetch
      fonts:
        - asset: assets/fonts/ChakraPetch-Medium.ttf
          weight: 500
        - asset: assets/fonts/ChakraPetch-Bold.ttf
          weight: 700
        - asset: assets/fonts/ChakraPetch-Italic.ttf
          weight: 500
          style: italic
        - asset: assets/fonts/ChakraPetch-BoldItalic.ttf
          weight: 700
          style: italic
    - family: NotoSansSC
      fonts:
        - asset: assets/fonts/NotoSansSC-VF.ttf
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono-VF.ttf
    # 历史字体：保留声明，旧资产引用不报错；新代码一律走上面三套
    - family: FangYuan
      fonts:
        - asset: assets/fonts/FangYuan-VF.ttf
    - family: ShuHei
      fonts:
        - asset: assets/fonts/ShuHei-Bold.ttf
    - family: Tektur
      fonts:
        - asset: assets/fonts/Tektur-VF.ttf
    - family: KodeMono
      fonts:
        - asset: assets/fonts/KodeMono-VF.ttf
