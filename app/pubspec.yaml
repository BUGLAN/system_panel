name: system_panel
description: "宿主 SYSTEM — 网文系统流自我提升 App（Flutter 客户端）"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  flutter_svg: ^2.3.0
  shared_preferences: ^2.5.6
  # ── Agent 层三件套（t4 集中一次加齐）──
  # http：LLM OpenAI 兼容调用（纯 Dart，无平台代码）
  http: ^1.2.0
  # image_picker：证据拍照/选图（Android 走 MediaStore，无需 manifest 权限）
  image_picker: ^1.1.0
  # path_provider：证据照片落 App 文档目录 evidence/
  path_provider: ^2.1.0
  audioplayers: ^6.8.1
  vibration: ^3.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  shared_preferences_platform_interface: ^2.4.2

flutter:
  uses-material-design: true

  # 天幕背景（宿主用 ComfyUI 生成的 Qwen-Image 底图，垫在 #bg .sky 最底层）
  assets:
    - assets/img/bg-void.jpg
    # 音效素材包—— 由 tools/audio/gen_sfx.mjs 离线烘焙，
    # 参数照 prototype/opus-v2-dir/js/audio.js，可 `--seed` 重烤。
    # 「事件 → 文件」的查表在 lib/state/sfx.dart；改名要两边一起改。
    - assets/audio/
    - assets/legal/
  # 字体：唯一基准 = 宿主养成系统_重设计.html 的 :root（L16-18），只打包这三套
  #   --fd Chakra Petch（标题/拉丁大字，静态 500/700 + 真斜体）
  #   --fc Noto Sans SC（中文正文，可变）
  #   --fm JetBrains Mono（等宽读数，可变）
  # 可变字体的字重必须在代码里用 fontVariations 指定（refText(wght: …) 已封装），
  # 光写 fontWeight 不生效 —— NotoSansSC 的默认实例是 wght 100（Thin）。
  # 参考稿 .grade/.rank/.lu-t/.tk-g b/.rec-r 都是 italic，
  # 所以 Chakra Petch 必须带 BoldItalic 静态档，否则斜体是合成的。
  #
  # ⚠️ NotoSansSC-VF.ttf 是**子集**（GB2312 全部 + ASCII + 常用标点 + app/lib 里
  #    出现过的所有字符，仍是可变字体），17MB → 约 4MB。原版在
  #    tools/fonts/src/（不进包）；新增界面文案后跑
  #    `python3 tools/fonts/subset_noto_sc.py --check`，报缺字就去掉 --check 重生成。
  #    子集外的字（生僻字、emoji）由系统字体兜底。详见 tools/fonts/README.md。
  # 2026-11-06 安装包瘦身：旧字体 FangYuan / ShuHei / Tektur / KodeMono（共约
  #    8.4MB）已撤掉 —— 只剩已删的旧开机屏在用；品牌图标生成要用的 ShuHei /
  #    Tektur 挪到了 brand/fonts/。
  fonts:
    - family: ChakraPetch
      fonts:
        - asset: assets/fonts/ChakraPetch-Medium.ttf
          weight: 500
        - asset: assets/fonts/ChakraPetch-Bold.ttf
          weight: 700
        - asset: assets/fonts/ChakraPetch-Italic.ttf
          weight: 500
          style: italic
        - asset: assets/fonts/ChakraPetch-BoldItalic.ttf
          weight: 700
          style: italic
    - family: NotoSansSC
      fonts:
        - asset: assets/fonts/NotoSansSC-VF.ttf
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono-VF.ttf
