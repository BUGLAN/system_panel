name: system_panel
description: "宿主 SYSTEM — 网文系统流自我提升 App（Flutter 客户端）"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  flutter_svg: ^2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  # 字体四件套 —— 真源：prototype/opus-v2-dir/css/app.css 的 @font-face
  # 四个都是可变字体，字重/字宽必须在代码里用 fontVariations 指定：
  #   TextStyle(fontVariations: [FontVariation('wght', 700), FontVariation('wdth', 75)])
  # 光写 fontWeight 不生效（FangYuan 的默认实例是 wght 700）。
  # 原型的字体是 woff2，Flutter 不认，已用 .verify/woff2ttf.py 转成 ttf。
  fonts:
    - family: FangYuan # 正文 / 她的话（阿里妈妈方圆体，wght 200-700）
      fonts:
        - asset: assets/fonts/FangYuan-VF.ttf
    - family: ShuHei # 标题（阿里妈妈数黑体）
      fonts:
        - asset: assets/fonts/ShuHei-Bold.ttf
    - family: Tektur # 数字 / 拉丁大字（wdth 75-100，wght 400-900）
      fonts:
        - asset: assets/fonts/Tektur-VF.ttf
    - family: KodeMono # 系统读数 / 等宽（wght 400-700）
      fonts:
        - asset: assets/fonts/KodeMono-VF.ttf
