<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no"
    />
    <meta name="theme-color" content="#06050c" />
    <meta name="color-scheme" content="dark" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="宿主养成系统" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/app-icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon-180x180.png" />
    <!-- 启动图：npm run splash 生成，别手改 -->
    <!-- iPhone 16 Pro Max / 17 Pro Max / 18 Pro Max -->
    <link
      rel="apple-touch-startup-image"
      media="(device-width: 440px) and (device-height: 956px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)"
      href="/splash/440x956@3x.png"
    />
    <!-- iPhone 14 Pro Max / 15 Pro Max / 15 Plus / 16 Plus -->
    <link
      rel="apple-touch-startup-image"
      media="(device-width: 430px) and (device-height: 932px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)"
      href="/splash/430x932@3x.png"
    />
    <!-- iPhone 12 Pro Max / 13 Pro Max / 14 Plus -->
    <link
      rel="apple-touch-startup-image"
      media="(device-width: 428px) and (device-height: 926px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)"
      href="/splash/428x926@3x.png"
    />
    <!-- iPhone Air -->
    <link
      rel="apple-touch-startup-image"
      media="(device-width: 420px) and (device-height: 912px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)"
      href="/splash/420x912@3x.png"
    />
    <!-- iPhone XS Max / 11 Pro Max -->
    <link
      rel="apple-touch-startup-image"
      media="(device-width: 414px) and (device-height: 896px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)"
      href="/splash/414x896@3x.png"
    />
    <!-- iPhone XR / 11 -->
    <link
      rel="apple-touch-startup-image"
      media="(device-width: 414px) and (device-height: 896px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)"
      href="/splash/414x896@2x.png"
    />
    <!-- iPhone 6s Plus / 7 Plus / 8 Plus -->
    <link
      rel="apple-touch-startup-image"
      media="(device-width: 414px) and (device-height: 736px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)"
      href="/splash/414x736@3x.png"
    />
    <!-- iPhone 16 Pro / 17 / 17 Pro / 18 Pro -->
    <link
      rel="apple-touch-startup-image"
      media="(device-width: 402px) and (device-height: 874px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)"
      href="/splash/402x874@3x.png"
    />
    <!-- iPhone 14 Pro / 15 / 15 Pro / 16 -->
    <link
      rel="apple-touch-startup-image"
      media="(device-width: 393px) and (device-height: 852px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)"
      href="/splash/393x852@3x.png"
    />
    <!-- iPhone 12 / 13 / 14 / 16e / 17e -->
    <link
      rel="apple-touch-startup-image"
      media="(device-width: 390px) and (device-height: 844px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)"
      href="/splash/390x844@3x.png"
    />
    <!-- iPhone X / XS / 11 Pro / 12 mini / 13 mini -->
    <link
      rel="apple-touch-startup-image"
      media="(device-width: 375px) and (device-height: 812px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)"
      href="/splash/375x812@3x.png"
    />
    <!-- iPhone 8 / SE 第二、三代 -->
    <link
      rel="apple-touch-startup-image"
      media="(device-width: 375px) and (device-height: 667px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)"
      href="/splash/375x667@2x.png"
    />
    <!-- /启动图 -->
    <title>宿主养成系统</title>
    <!-- 样式表到之前先给底色（与 design/base.css 的 body 底色一致），免得从主屏幕启动时先闪一下白屏 -->
    <style>
      html {
        background: #030208;
      }
      /* 接 iOS 启动图的那一帧：尺寸、圆角与 scripts/splash.mjs 的 ICON_PT / ICON_RADIUS 一致，
         #root 自己居中、背景也和启动图同一张，React 首次渲染时整个换掉 */
      .boot-icon {
        width: 120px;
        height: 120px;
        border-radius: 22.37%;
      }
    </style>
  </head>
  <body>
    <!-- #root 里先放图标：页面只有底色时 WebKit 不画第一帧（算「视觉上是空的」），
         iOS 撤启动图时露出的是网页视图自带的白底，闪约 0.4 秒；有张图就能马上画出来，启动图淡出后接得上 -->
    <div id="root"><img class="boot-icon" src="/app-icon.svg" alt="" /></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
